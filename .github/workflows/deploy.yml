# Deploy otomatis ke Cloudflare setiap ada push ke main.
#
# Secrets yang wajib ada di GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token API Cloudflare (izin: lihat README, bagian "Deploy otomatis")
#   CLOUDFLARE_ACCOUNT_ID  ID akun Cloudflare tujuan
#   ADMIN_PASSWORD         kata sandi dashboard admin
#   ADMIN_SESSION_SECRET   rahasia HMAC sesi admin (minimal 32 karakter acak)
#   CF_ANALYTICS_API_TOKEN token "Account Analytics Read" untuk grafik pengunjung di admin (opsional)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy dalam satu waktu. Deploy yang sedang jalan tidak dibatalkan,
# supaya state Alchemy tidak tertinggal setengah jadi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Alchemy dijalankan lewat Node (lihat packages/infra/package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test packages apps/web/src/components apps/web/src/lib apps/web/src/utils

      - name: Deploy (Alchemy, stage production)
        working-directory: packages/infra
        run: bun run deploy -- --stage production --yes --no-input
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
